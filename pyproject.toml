[project]
name = "flame"
version = "0.1.0"
description = "Minimal plan-act-verify harness that spawns the local Cursor agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
flame = "flame.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flame = ["data/fact-graph/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
